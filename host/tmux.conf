# =============================================================================
# tmux.conf — Dev-optimized config
# =============================================================================

# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- General settings ---
# Activate the Zulip venv if it exists, then hand off to interactive zsh.
# Never short-circuit: if the venv is missing we still want a shell.
# /bin/zsh resolves on both macOS (system zsh) and modern Linux (usrmerge).
set -g default-command "/bin/zsh -c '[ -r \"$HOME/zulip/.venv/bin/activate\" ] && . \"$HOME/zulip/.venv/bin/activate\"; exec /bin/zsh'"
set -g default-shell /bin/zsh
# Copy-mode `y` lands in the macOS pasteboard. On Linux, tmux-yank handles
# its own bindings via xclip/wl-copy, and Ghostty's OSC52 covers the
# built-in bindings — so this conditional is the only special-case needed.
if-shell '[ "$(uname)" = Darwin ]' 'set -s copy-command pbcopy'
# default-terminal is a *server* option (since long before 3.0) — `-s`
# is the documented form. `-g` is silently accepted but wrong scope.
set -s default-terminal "tmux-256color"
# terminal-features (below) already declares RGB for the terminals we
# actually use; the legacy terminal-overrides line is redundant. Kept
# the comment for archaeology — if you ever drop the terminal-features
# lines, re-add `set -as terminal-overrides ",xterm-256color:RGB"`.
# Pass-through for kitty-graphics protocol so termpdf-rs (and any other
# tool that draws images via APC sequences) can paint into a pane.
# tmux 3.3+ silently strips APC escapes unless allow-passthrough is on
# — passthrough is what enables the protocol; tmux itself never decodes
# kitty-graphics, so there is no named terminal-feature to declare.
# allow-passthrough is a *pane* option, so `-gw` (global window-default
# scope, where pane-options inherit from) is the correct form.
set -gw allow-passthrough on
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks"
set -as terminal-features ",tmux-256color:RGB"
# Extended keys: lets tmux distinguish Shift+Enter from plain Enter so
# Claude Code's "newline without submit" works inside a tmux pane.
# Without this the outer terminal's CSI-u sequence is collapsed back
# to a bare CR before Claude sees it.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0                # No delay after Esc (important for vim)
# focus-events is a server option per the tmux 3.6 man page.
set -s focus-events on              # Needed for vim autoread
set -g display-time 4000
# Default to 5s; claude-tmux-state.sh bumps this to 1s globally while
# any window is in @claude_state=working (so the pulsing dot
# rendered by claude-tmux-status.sh animates) and drops it back to 5
# once the working session ends.
set -g status-interval 5

# --- Splits (intuitive keys) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Move current window left/right in the window list ---
# `-r` allows holding the prefix and repeating < / > without re-prefixing.
bind -r < swap-window -t -1
bind -r > swap-window -t +1

# --- Vim-style pane navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane switching with awareness of Vim splits (no shell spawn)
is_vim="#{m/ri:(^|\/)g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}"
bind -n C-h if -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "$is_vim" 'send-keys C-l' 'select-pane -R'

# --- Resize panes ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Move (swap) panes directionally ---
# Prefix + Alt+h/j/k/l swaps the current pane with its neighbour. Focus
# follows the moved pane. `-r` allows repeating without re-prefixing.
bind -r M-h swap-pane -t '{left-of}'
bind -r M-j swap-pane -t '{down-of}'
bind -r M-k swap-pane -t '{up-of}'
bind -r M-l swap-pane -t '{right-of}'

# --- Copy mode (vi keys) ---
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- File finder (prefix f, then g or s) ---
# fd | fzf in a popup; both variants honor ~/.config/fd/ignore so
# results match the Neovim pickers. `g` skips dotfiles, `s` surfaces
# them too (--hidden).
bind f switch-client -T finder
bind -T finder g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "EDITOR=nvim ~/.local/bin/tmux-fzf-find.sh"
bind -T finder s display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "EDITOR=nvim ~/.local/bin/tmux-fzf-find.sh hidden"

# --- Quick reload ---
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Session management ---
bind S command-prompt -p "New session:" "new-session -s '%%'"
bind s choose-tree -sZ           # Session picker

# --- GitHub Dark theme ---
# Single source of truth for tmux colors. Shared with ghostty and
# starship so swapping a slot here is a one-line change.
#   bg #010409    surface #21262d   border #30363d
#   text #e6edf3  muted   #7d8590
#   primary #bc8cff   accent #58a6ff   warning #d29922
gh_bg="#010409"
gh_surface="#21262d"
gh_border="#30363d"
gh_text="#e6edf3"
gh_muted="#7d8590"
gh_primary="#bc8cff"
gh_accent="#58a6ff"

# Pane borders: muted when inactive, primary when active.
set -g pane-border-style "fg=$gh_border"
set -g pane-active-border-style "fg=$gh_primary"

# --- Window auto-rename ---
# `on` is the default for allow-rename; kept here so the precmd
# `tmux rename-window` in zsh-aliases.zsh isn't silently no-op'd if a
# future tmux release flips the default. It's a *window* option, so the
# documented form is `-gw` (global default for window scope).
set -gw allow-rename on

# --- Status bar ---
set -g status-position top
set -g status-style "bg=$gh_bg,fg=$gh_text"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Session name on the left — flat bold purple, no powerline trailer
# (so $gh_primary uniquely means "Claude" everywhere else on the bar).
set -g status-left "#[fg=$gh_primary,bold] #S  "

# Right side intentionally empty — date/time/battery live on the
# waybar strip now, no point duplicating them inside tmux.
set -g status-right ""

# Window list: current tab is a surface-colored block with bold accent
# text; inactive tabs use the muted slot, with the tab index rendered
# in the same muted hue but **bold** — weight (not brightness) makes
# `prefix + <num>` targeting scannable, while keeping the active tab
# visually loudest.
# A thin │ separator between tabs improves scannability on long strips.
# `[z]` prefix marks zoomed panes (matches the old catppuccin behaviour).
# `#(claude-tmux-status.sh ...)` renders a glyph for the window's
# active process — pulsing dot for claude working, ⚠ for permission
# prompts, or a nerd-font icon for nvim/bash/node/python/git/etc. The
# script emits muted-gray glyphs on inactive tabs and the full brand
# color on the active tab so color tracks selection, not noise.
# Base styles live in window-status-{,current-}style so that the
# `#[default]` emitted by the status script restores them — otherwise
# `#[default]` would strip the current tab's attributes and the
# highlight wouldn't extend past the script's glyph.
set -g window-status-separator "#[fg=$gh_border,bg=$gh_bg,nobold]│"
set -g window-status-style "fg=$gh_muted,bg=$gh_bg"
set -g window-status-current-style "fg=$gh_accent,bg=$gh_surface,bold"
set -g window-status-format "  #[fg=$gh_muted,bold]#I#[default] #{?window_zoomed_flag,[z] ,}#(~/.local/bin/claude-tmux-status.sh #{window_id} inactive)#{b:pane_current_path}  "
set -g window-status-current-format "  #I #{?window_zoomed_flag,[z] ,}#(~/.local/bin/claude-tmux-status.sh #{window_id} active)#{b:pane_current_path}  "

# Message / command prompt.
set -g message-style "bg=$gh_surface,fg=$gh_text"
set -g message-command-style "bg=$gh_surface,fg=$gh_text"

# Mode (copy / selection) highlight.
set -g mode-style "bg=$gh_primary,fg=$gh_bg"

# --- Plugins (via TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'      # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'       # Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'            # System clipboard in copy mode

# tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: auto-save every 15 min
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
